<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>German Verbs Guide | Hellboy Chronicles</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0907;color:#eadfc7;font-family:Georgia,serif}.top{position:sticky;top:0;z-index:4;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:#0b0907ee;border-bottom:1px solid #b9924555}.top a{color:#e5c469;text-decoration:none}.wrap{max-width:980px;margin:auto;padding:34px 18px 80px}.eyebrow{font:800 11px system-ui;letter-spacing:.15em;color:#d2ad54}.title{font-size:clamp(36px,7vw,64px);margin:7px 0}.sub{color:#aa9e89;line-height:1.55}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:26px}.study-card{border:1px solid #b9924544;background:#15110d;border-radius:15px;padding:16px}.head{display:flex;justify-content:space-between;gap:8px}.word{font-size:28px;color:#f0d789}.meaning{font:12px system-ui;color:#9f927f;text-align:right}.forms{font:14px system-ui;line-height:1.6;margin:12px 0;color:#d6c9b1}.example{font-style:italic;line-height:1.45}.actions{display:flex;gap:7px;margin-top:12px}.actions button,.quiz button{border:1px solid #b9924555;background:#211a12;color:#fff;border-radius:8px;padding:8px 10px;font-weight:700}.quiz{display:none;margin-top:12px}.quiz.open{display:block}.quiz input{width:100%;padding:10px;background:#0e0c0a;color:#fff;border:1px solid #b9924555;border-radius:8px}.feedback{font:13px system-ui;margin-top:7px}.feedback.ok{color:#75d28a}.feedback.bad{color:#ffb4ab}</style></head><body><header class="top"><a href="/de/universal-stories/lost-key">← THE LOST KEY</a><strong>🇩🇪 GERMAN STUDY</strong><a href="/de/german-nouns">NOUNS →</a></header><main class="wrap"><div class="eyebrow">CORE LANGUAGE GUIDE</div><h1 class="title">GERMAN VERBS</h1><p class="sub">High-frequency verbs used in Universal Core Stories. Practice the infinitive, hear it, then write your own sentence. Capitalization and umlauts are optional in practice.</p><div class="grid" id="grid"></div></main><script>const data=[['sein','to be',['ich bin','du bist','er/sie/es ist','wir sind','ihr seid','sie/Sie sind'],'Ich bin zu Hause.'],['haben','to have',['ich habe','du hast','er/sie hat','wir haben','ihr habt','sie haben'],'Ich habe einen Schlüssel.'],['gehen','to go',['ich gehe','du gehst','er geht','wir gehen','ihr geht','sie gehen'],'Ich gehe zum Café.'],['kommen','to come',['ich komme','du kommst','er kommt','wir kommen','ihr kommt','sie kommen'],'Sie kommt heute Abend.'],['sehen','to see',['ich sehe','du siehst','er sieht','wir sehen','ihr seht','sie sehen'],'Ich sehe den Bus.'],['schauen','to look/watch',['ich schaue','du schaust','er schaut','wir schauen','ihr schaut','sie schauen'],'Ich schaue auf die Straße.'],['sprechen','to speak',['ich spreche','du sprichst','er spricht','wir sprechen','ihr sprecht','sie sprechen'],'Wir sprechen Deutsch.'],['sagen','to say',['ich sage','du sagst','er sagt','wir sagen','ihr sagt','sie sagen'],'Ich sage danke.'],['fragen','to ask',['ich frage','du fragst','er fragt','wir fragen','ihr fragt','sie fragen'],'Ich frage nach Hilfe.'],['wissen','to know',['ich weiß','du weißt','er weiß','wir wissen','ihr wisst','sie wissen'],'Ich weiß, wo er ist.'],['denken','to think',['ich denke','du denkst','er denkt','wir denken','ihr denkt','sie denken'],'Ich denke an den Schlüssel.'],['wollen','to want',['ich will','du willst','er will','wir wollen','ihr wollt','sie wollen'],'Ich will nach Hause.'],['können','can / to be able',['ich kann','du kannst','er kann','wir können','ihr könnt','sie können'],'Ich kann dir helfen.'],['müssen','must / to have to',['ich muss','du musst','er muss','wir müssen','ihr müsst','sie müssen'],'Ich muss gehen.'],['geben','to give',['ich gebe','du gibst','er gibt','wir geben','ihr gebt','sie geben'],'Ich gebe Anna den Schlüssel.'],['nehmen','to take',['ich nehme','du nimmst','er nimmt','wir nehmen','ihr nehmt','sie nehmen'],'Ich nehme den Bus.'],['finden','to find',['ich finde','du findest','er findet','wir finden','ihr findet','sie finden'],'Ich finde meinen Schlüssel.'],['verlieren','to lose',['ich verliere','du verlierst','er verliert','wir verlieren','ihr verliert','sie verlieren'],'Ich verliere oft meine Schlüssel.'],['öffnen','to open',['ich öffne','du öffnest','er öffnet','wir öffnen','ihr öffnet','sie öffnen'],'Ich öffne die Tür.'],['schließen','to close',['ich schließe','du schließt','er schließt','wir schließen','ihr schließt','sie schließen'],'Ich schließe meine Tasche.'],['laufen','to walk/run',['ich laufe','du läufst','er läuft','wir laufen','ihr lauft','sie laufen'],'Ich laufe durch die Straße.'],['warten','to wait',['ich warte','du wartest','er wartet','wir warten','ihr wartet','sie warten'],'Ich warte auf den Bus.'],['helfen','to help',['ich helfe','du hilfst','er hilft','wir helfen','ihr helft','sie helfen'],'Ich helfe meinem Freund.'],['sich erinnern','to remember',['ich erinnere mich','du erinnerst dich','er erinnert sich','wir erinnern uns','ihr erinnert euch','sie erinnern sich'],'Ich erinnere mich an das Café.']];const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss').trim();const g=document.getElementById('grid');data.forEach(([w,m,fs,ex])=>{const c=document.createElement('article');c.className='study-card';c.dataset.word=w;c.innerHTML=`<div class="head"><div class="word" data-headword>${w}</div><div class="meaning">${m}</div></div><div class="forms">${fs.join('<br>')}</div><div class="example">${ex}</div><div class="actions"><button class="listen">🔊 LISTEN</button><button class="practice">✎ PRACTICE</button></div><div class="quiz"><input placeholder="Type the German infinitive"><button class="check">CHECK</button><div class="feedback"></div></div>`;g.appendChild(c);c.querySelector('.listen').onclick=()=>speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(w),{lang:'de-DE'}));c.querySelector('.practice').onclick=()=>c.querySelector('.quiz').classList.toggle('open');c.querySelector('.check').onclick=()=>{const f=c.querySelector('.feedback'),v=c.querySelector('input').value;const ok=norm(v)===norm(w);f.className='feedback '+(ok?'ok':'bad');f.textContent=ok?'✓ Correct':`Try again · ${w}`}});</script><script src="/german-guide-practice.js?v=de-1"></script></body></html>
