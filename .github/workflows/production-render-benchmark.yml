name: Production Render Benchmark
on:
  push:
    branches: [main]
    paths: ['.github/workflows/production-render-benchmark.yml']
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm init -y && npm install playwright@1.55.0
      - run: npx playwright install --with-deps webkit
      - name: Run fast cold-cache WebKit benchmark
        run: |
          node - <<'NODE'
          const { webkit } = require('playwright');
          const BASE='https://hellboychronicles.vercel.app';
          const routes=['/','/folk-tales/collection','/ua/folk-tales/collection','/folk-tales/collection/comic','/ua/folk-tales/collection/comic','/hellboy/comic'];
          const ms=n=>Number.isFinite(n)?Math.round(n):null;
          const device={viewport:{width:393,height:852},deviceScaleFactor:3,isMobile:true,hasTouch:true};
          (async()=>{
            const browser=await webkit.launch();
            const routeResults=[];
            for(const path of routes){
              const context=await browser.newContext(device);const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(String(e)));const start=Date.now();
              try{
                await page.goto(BASE+path,{waitUntil:'commit',timeout:15000});
                await page.waitForSelector('body',{state:'visible',timeout:8000});
                await page.waitForFunction(()=>document.body.innerText.trim().length>80,null,{timeout:8000});
                const usable=Date.now()-start;await page.waitForTimeout(700);
                const p=await page.evaluate(()=>{const nav=performance.getEntriesByType('navigation')[0]||{};const paints=performance.getEntriesByType('paint');const fcp=paints.find(x=>x.name==='first-contentful-paint')?.startTime||0;const r=performance.getEntriesByType('resource');return{fcp,dom:nav.domContentLoadedEventEnd||0,load:nav.loadEventEnd||0,bytes:r.reduce((s,x)=>s+(x.transferSize||0),nav.transferSize||0),requests:r.length+1,storyText:document.querySelector('#storyReader')?.innerText.length||0};});
                routeResults.push({path,usableMs:usable,fcpMs:ms(p.fcp),domReadyMs:ms(p.dom),loadMs:ms(p.load),bytes:p.bytes,requests:p.requests,storyText:p.storyText,errors});
              }catch(e){routeResults.push({path,error:String(e),elapsedMs:Date.now()-start,errors});}
              await context.close();
            }
            async function testComicPage(n){
              const context=await browser.newContext(device);const page=await context.newPage();const start=Date.now();
              try{
                await page.goto(`${BASE}/folk-tales/collection/comic#page-${n}`,{waitUntil:'commit',timeout:15000});
                await page.waitForFunction(pageNo=>{const img=document.querySelector(`#page-${pageNo} img`);return !!img&&img.complete&&img.naturalWidth>100&&img.naturalHeight>100;},n,{timeout:8000});
                const imageReadyMs=Date.now()-start;const info=await page.evaluate(pageNo=>{const img=document.querySelector(`#page-${pageNo} img`);return{src:img.currentSrc||img.src,width:img.naturalWidth,height:img.naturalHeight,fallback:img.dataset.fallback==='1'};},n);await context.close();return{page:n,imageReadyMs,...info};
              }catch(e){await context.close();return{page:n,error:String(e),elapsedMs:Date.now()-start};}
            }
            const comicPages=[];
            for(let start=1;start<=30;start+=6){
              const batch=Array.from({length:Math.min(6,31-start)},(_,i)=>start+i);
              comicPages.push(...await Promise.all(batch.map(testComicPage)));
            }
            comicPages.sort((a,b)=>a.page-b.page);
            const controls={};
            try{
              const context=await browser.newContext(device);const page=await context.newPage();
              await page.goto(BASE+'/folk-tales/collection',{waitUntil:'commit',timeout:15000});
              await page.waitForFunction(()=>document.querySelector('#storyCounter')?.textContent.includes('1 / 13'),null,{timeout:8000});
              try{const before=parseFloat(await page.locator('#storyReader').evaluate(el=>getComputedStyle(el).fontSize));await page.locator('#largerText').click({timeout:5000});const after=parseFloat(await page.locator('#storyReader').evaluate(el=>getComputedStyle(el).fontSize));controls.fontPlus=after>before;}catch(e){controls.fontPlus=false;controls.fontPlusError=String(e)}
              try{await page.locator('#nextStory').click({timeout:5000});await page.waitForFunction(()=>document.querySelector('#storyCounter')?.textContent.includes('2 / 13'),null,{timeout:4000});controls.nextStory=(await page.locator('#storyReader .chapter-title').textContent())?.includes('Mitten');}catch(e){controls.nextStory=false;controls.nextStoryError=String(e)}
              try{const t=Date.now();await page.locator('#openVocabulary').click({timeout:5000});await page.waitForFunction(()=>{const d=document.querySelector('.vocab-dialog');return !!d&&(d.open||d.hasAttribute('open'));},null,{timeout:6000});controls.savedWords=true;controls.savedWordsOpenMs=Date.now()-t;}catch(e){controls.savedWords=false;controls.savedWordsError=String(e)}
              await context.close();
            }catch(e){controls.setupError=String(e)}
            console.log('BENCHMARK_JSON_START');console.log(JSON.stringify({routeResults,comicPages,controls},null,2));console.log('BENCHMARK_JSON_END');await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
