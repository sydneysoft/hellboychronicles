name: Fix French reader translator
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-french-reader-translator.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire translator into French text reader
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Make the shared translator detect language outside the universal reader.
          p = Path('universal-vocabulary.js')
          s = p.read_text()
          old = "function currentLang(){return document.querySelector('.langs button.on')?.dataset.lang||'en'}"
          new = "function currentLang(){const active=document.querySelector('.langs button.on')?.dataset.lang;if(active)return active;const bodyLang=document.body?.dataset?.novelLanguage;if(bodyLang&&names[bodyLang])return bodyLang;const path=location.pathname;return /^\\/fr(?:\\/|$)/.test(path)?'fr':/^\\/pl(?:\\/|$)/.test(path)?'pl':/^\\/ua(?:\\/|$)/.test(path)?'uk':/^\\/de(?:\\/|$)/.test(path)?'de':/^\\/es(?:\\/|$)/.test(path)?'es':'en'}"
          if old not in s:
              raise SystemExit('currentLang pattern not found')
          p.write_text(s.replace(old,new,1))

          # Load the shared translator in the French prose reader and expose its language.
          p = Path('french-folk-text.html')
          s = p.read_text()
          s = s.replace('<body>', '<body data-novel-language="en">', 1)
          marker = "document.documentElement.lang=fr?'fr':'en';"
          replacement = marker + "document.body.dataset.novelLanguage=fr?'fr':'en';"
          if marker not in s:
              raise SystemExit('French language marker not found')
          s = s.replace(marker, replacement, 1)
          end = '</body></html>'
          inject = '<script src="/universal-vocabulary.js?v=french-reader-1"></script>\n' + end
          if end not in s:
              raise SystemExit('body end marker not found')
          s = s.replace(end, inject, 1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add universal-vocabulary.js french-folk-text.html
          git commit -m "Enable translator in French text reader" || exit 0
          git push
