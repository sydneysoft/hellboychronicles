name: Integrate French Folk Tales Text Edition

on:
  push:
    paths:
      - '.github/workflows/integrate-french-text.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add text routes and format switch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          cfg_path = Path('vercel.json')
          cfg = json.loads(cfg_path.read_text(encoding='utf-8'))
          rewrites = cfg.setdefault('rewrites', [])
          wanted = [
              {'source':'/french-folk-tales/collection','destination':'/french-folk-text'},
              {'source':'/fr/french-folk-tales/collection','destination':'/french-folk-text'},
          ]
          existing = {r.get('source') for r in rewrites}
          for rule in wanted:
              if rule['source'] not in existing:
                  rewrites.append(rule)
          cfg_path.write_text(json.dumps(cfg, separators=(',',':')) + '\n', encoding='utf-8')

          comic = Path('french-folk-comic.html')
          text = comic.read_text(encoding='utf-8')
          if 'TEXT EDITION' not in text and 'ÉDITION TEXTE' not in text:
              marker = '<section class="wrap"><div class="chapter-index" id="chapters"></div></section>'
              replacement = '<section class="wrap"><div style="text-align:center;margin:0 0 22px"><a id="textEditionLink" href="/french-folk-tales/collection" style="display:inline-block;padding:10px 14px;border:1px solid #dab86077;border-radius:12px;color:#ead077;text-decoration:none;font-weight:800">TEXT EDITION</a></div><div class="chapter-index" id="chapters"></div></section>'
              if marker in text:
                  text = text.replace(marker, replacement)
              lang_marker = "if(fr){eyebrow.textContent='Cinq contes illustrés en français et en anglais';"
              if lang_marker in text:
                  text = text.replace(lang_marker, "if(fr){const tl=document.getElementById('textEditionLink');if(tl){tl.textContent='ÉDITION TEXTE';tl.href='/fr/french-folk-tales/collection'};eyebrow.textContent='Cinq contes illustrés en français et en anglais';")
              comic.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/integrate-french-text.yml')
          if workflow.exists(): workflow.unlink()
          PY
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vercel.json french-folk-comic.html .github/workflows/integrate-french-text.yml
          git commit -m 'Publish French Folk Tales text edition routes'
          git push origin HEAD:main
