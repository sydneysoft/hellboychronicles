name: Optimize Folk Collection Images

on:
  push:
    paths:
      - '.github/workflows/optimize-folk-images.yml'

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Build lightweight WebP pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import io, json

          SRC = Path('folk-collection-pages')
          OUT = Path('folk-collection-pages-lite')
          OUT.mkdir(exist_ok=True)
          LIMIT = 130 * 1024
          TARGET = 126 * 1024

          def encode(image, quality):
              buf = io.BytesIO()
              image.save(buf, 'WEBP', quality=quality, method=6, optimize=True)
              return buf.getvalue()

          results = []
          for source in sorted(SRC.glob('page-*.jpg')):
              with Image.open(source) as original:
                  image = original.convert('RGB')
                  original_size = source.stat().st_size
                  original_dims = image.size
                  chosen = None
                  chosen_q = None
                  chosen_scale = None

                  # Preserve resolution first. If necessary, reduce dimensions slightly
                  # rather than destroying text clarity with extremely low quality.
                  for scale_try in (1.0, 0.94, 0.88, 0.82, 0.76, 0.70, 0.64, 0.58):
                      candidate = image if scale_try == 1.0 else image.resize(
                          (round(original_dims[0] * scale_try), round(original_dims[1] * scale_try)),
                          Image.Resampling.LANCZOS,
                      )

                      lo, hi = 24, 88
                      best = None
                      best_q = None
                      while lo <= hi:
                          q = (lo + hi) // 2
                          data = encode(candidate, q)
                          if len(data) <= TARGET:
                              best, best_q = data, q
                              lo = q + 1
                          else:
                              hi = q - 1

                      if best is not None:
                          chosen = best
                          chosen_q = best_q
                          chosen_scale = scale_try
                          break

                  if chosen is None:
                      # Absolute safety path: step down until the requested cap is met.
                      scale_try = 0.54
                      while scale_try >= 0.40 and chosen is None:
                          candidate = image.resize(
                              (round(original_dims[0] * scale_try), round(original_dims[1] * scale_try)),
                              Image.Resampling.LANCZOS,
                          )
                          for q in (24, 22, 20, 18):
                              data = encode(candidate, q)
                              if len(data) <= TARGET:
                                  chosen = data
                                  chosen_q = q
                                  chosen_scale = scale_try
                                  break
                          scale_try -= 0.04

                  if chosen is None or len(chosen) > LIMIT:
                      raise RuntimeError(f'Could not compress {source.name} below 130 KB')

                  destination = OUT / source.with_suffix('.webp').name
                  destination.write_bytes(chosen)
                  results.append({
                      'page': destination.name,
                      'bytes': len(chosen),
                      'kb': round(len(chosen) / 1024, 1),
                      'quality': chosen_q,
                      'scale': chosen_scale,
                      'dimensions': [round(original_dims[0] * chosen_scale), round(original_dims[1] * chosen_scale)],
                      'original_kb': round(original_size / 1024, 1),
                  })

          if len(results) != 30:
              raise RuntimeError(f'Expected 30 pages, generated {len(results)}')

          total = sum(x['bytes'] for x in results)
          maximum = max(x['bytes'] for x in results)
          Path('folk-collection-pages-lite/optimization-report.json').write_text(
              json.dumps({
                  'page_count': len(results),
                  'total_bytes': total,
                  'total_mb': round(total / 1024 / 1024, 2),
                  'max_page_bytes': maximum,
                  'max_page_kb': round(maximum / 1024, 1),
                  'limit_kb': 130,
                  'pages': results,
              }, indent=2) + '\n',
              encoding='utf-8',
          )
          print(f'Generated {len(results)} pages: {total/1024/1024:.2f} MB total; max {maximum/1024:.1f} KB')
          PY

      - name: Switch reader to optimized assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          app = Path('folk-collection-app.js')
          text = app.read_text(encoding='utf-8')
          old = "const pageSource=page=>`/folk-collection-pages/page-${String(page).padStart(2,'0')}.jpg`;"
          new = "const pageSource=page=>`/folk-collection-pages-lite/page-${String(page).padStart(2,'0')}.webp`;"
          if old not in text and new not in text:
              raise RuntimeError('Could not find pageSource in folk-collection-app.js')
          app.write_text(text.replace(old, new), encoding='utf-8')

          html = Path('folk-collection-comic.html')
          html_text = html.read_text(encoding='utf-8')
          html_text = html_text.replace('/folk-collection-app.js?v=collection-1', '/folk-collection-app.js?v=collection-lite-1')
          html.write_text(html_text, encoding='utf-8')

          config_path = Path('vercel.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          headers = config.setdefault('headers', [])
          source = '/folk-collection-pages-lite/(.*)'
          if not any(item.get('source') == source for item in headers):
              headers.append({
                  'source': source,
                  'headers': [{'key': 'Cache-Control', 'value': 'public, max-age=31536000, immutable'}],
              })
          config_path.write_text(json.dumps(config, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Verify hard size cap
        run: |
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path('folk-collection-pages-lite').glob('page-*.webp'))
          assert len(files) == 30, len(files)
          oversized = [(p.name, p.stat().st_size) for p in files if p.stat().st_size > 130 * 1024]
          assert not oversized, oversized
          print('All 30 pages are <= 130 KB')
          PY

      - name: Commit optimized assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add folk-collection-pages-lite folk-collection-app.js folk-collection-comic.html vercel.json
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Serve lightweight folk collection images'
            git push origin HEAD:main
          fi
