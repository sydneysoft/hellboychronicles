name: Fix German reader translator
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-german-reader.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match German reader translator structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('german-folk-text.html')
          s=p.read_text()
          s=s.replace('<body id="story" data-novel-language="de">','<body data-novel-language="de">',1)
          if '<main id="story">' not in s:
              s=s.replace('</header>','</header>\n<main id="story">',1)
              s=s.replace('<footer class="footer">','</main>\n<footer class="footer">',1)
          s=s.replace('/universal-vocabulary.js?v=german-reader-2','/universal-vocabulary.js?v=german-reader-4')
          s=s.replace('/universal-vocabulary.js?v=german-reader-3','/universal-vocabulary.js?v=german-reader-4')
          if '/universal-vocabulary.js?v=german-reader-4' not in s:
              s=s.replace('</body>','<script src="/universal-vocabulary.js?v=german-reader-4"></script>\n</body>',1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add german-folk-text.html
          git commit -m "Fix German text translation modal" || exit 0
          git push
