name: Fix German reader translator
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-german-reader.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable StoryLingo translator on German text reader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('german-folk-text.html')
          s=p.read_text()
          if '<body id="story" data-novel-language="de">' not in s:
              s=s.replace('<body>','<body id="story" data-novel-language="de">',1)
          script='<script src="/universal-vocabulary.js?v=german-reader-2"></script>'
          if script not in s:
              s=s.replace('</body>',script+'\n</body>',1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add german-folk-text.html
          git commit -m "Enable translator in German text reader" || exit 0
          git push
