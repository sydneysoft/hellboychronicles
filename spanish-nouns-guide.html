<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spanish Nouns Guide | Hellboy Chronicles</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0907;color:#eadfc7;font-family:Georgia,serif}.top{position:sticky;top:0;z-index:4;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:#0b0907ee;border-bottom:1px solid #b9924555}.top a{color:#e5c469;text-decoration:none}.wrap{max-width:980px;margin:auto;padding:34px 18px 80px}.eyebrow{font:800 11px system-ui;letter-spacing:.15em;color:#d2ad54}.title{font-size:clamp(36px,7vw,64px);margin:7px 0}.sub{color:#aa9e89;line-height:1.55}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px;margin-top:26px}.study-card{border:1px solid #b9924544;background:#15110d;border-radius:15px;padding:16px}.word{font-size:25px;color:#f0d789}.meaning{font:13px system-ui;color:#a99b86;margin-top:4px}.example{font-style:italic;line-height:1.45;margin-top:10px}.actions{display:flex;gap:7px;margin-top:12px}.actions button,.quiz button{border:1px solid #b9924555;background:#211a12;color:#fff;border-radius:8px;padding:8px 10px;font-weight:700}.quiz{display:none;margin-top:12px}.quiz.open{display:block}.quiz input{width:100%;padding:10px;background:#0e0c0a;color:#fff;border:1px solid #b9924555;border-radius:8px}.feedback{font:13px system-ui;margin-top:7px}.feedback.ok{color:#75d28a}.feedback.bad{color:#ffb4ab}</style></head><body><header class="top"><a href="/es/spanish-verbs">← VERBS</a><strong>🇪🇸 SPANISH STUDY</strong><a href="/es/spanish-grammar">GRAMMAR →</a></header><main class="wrap"><div class="eyebrow">CORE LANGUAGE GUIDE</div><h1 class="title">SPANISH NOUNS</h1><p class="sub">Everyday nouns from The Lost Key. Learn the article with the noun, listen, then practice writing it.</p><div class="grid" id="grid"></div></main><script>const data=[['la llave','key','La llave está en la bolsa.'],['la casa','house/home','Vuelvo a casa.'],['el apartamento','apartment','Mi apartamento es pequeño.'],['la puerta','door','Abro la puerta.'],['la calle','street','Camino por la calle.'],['la ciudad','city','La ciudad se despierta.'],['el teléfono','phone','Miro mi teléfono.'],['el dinero','money','Tengo dinero.'],['el bolsillo','pocket','La llave está en el bolsillo.'],['la bolsa','bag','Abro la bolsa.'],['la tienda','shop','Voy a la tienda.'],['el agua','water','Bebo agua.'],['el pan','bread','El pan está caliente.'],['el café','coffee / café','Tomo un café.'],['la mesa','table','El teléfono está en la mesa.'],['la silla','chair','Me siento en la silla.'],['la ventana','window','Miro por la ventana.'],['el autobús','bus','Tomo el autobús.'],['la parada','stop','Espero en la parada.'],['el conductor','driver','El conductor abre la puerta.'],['la estación','station','Llegamos a la estación.'],['la lluvia','rain','La lluvia es fuerte.'],['la noche','night','Vuelvo por la noche.'],['el amigo','friend','Mi amigo me ayuda.'],['la mujer','woman','La mujer sonríe.'],['el hombre','man','El hombre espera.'],['el niño','boy/child','El niño encuentra algo.'],['la comida','food','Compro comida caliente.'],['el libro','book','Tengo un libro pequeño.'],['el cargador','charger','El cargador está en la bolsa.'],['el cuaderno','notebook','Escribo en el cuaderno.'],['el bolígrafo','pen','Tengo un bolígrafo azul.']];const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();const g=document.getElementById('grid');data.forEach(([w,m,ex])=>{const bare=w.replace(/^(el|la)\s+/,'');const c=document.createElement('article');c.className='study-card';c.dataset.word=bare;c.innerHTML=`<div class="word" data-headword>${w}</div><div class="meaning">${m}</div><div class="example">${ex}</div><div class="actions"><button class="listen">🔊 LISTEN</button><button class="practice">✎ PRACTICE</button></div><div class="quiz"><input placeholder="Type the Spanish noun"><button class="check">CHECK</button><div class="feedback"></div></div>`;g.appendChild(c);c.querySelector('.listen').onclick=()=>speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(w),{lang:'es-ES'}));c.querySelector('.practice').onclick=()=>c.querySelector('.quiz').classList.toggle('open');c.querySelector('.check').onclick=()=>{const f=c.querySelector('.feedback'),v=c.querySelector('input').value.replace(/^(el|la)\s+/i,'');const ok=norm(v)===norm(bare);f.className='feedback '+(ok?'ok':'bad');f.textContent=ok?'✓ Correct':`Try again · ${bare}`}});</script><script src="/spanish-guide-practice.js?v=es-1"></script></body></html>
