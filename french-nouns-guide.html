<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>French Nouns Guide | Hellboy Chronicles</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0907;color:#eadfc7;font-family:Georgia,serif}.top{position:sticky;top:0;z-index:4;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:#0b0907ee;border-bottom:1px solid #b9924555}.top a{color:#e5c469;text-decoration:none}.wrap{max-width:980px;margin:auto;padding:34px 18px 80px}.eyebrow{font:800 11px system-ui;letter-spacing:.15em;color:#d2ad54}.title{font-size:clamp(36px,7vw,64px);margin:7px 0}.sub{color:#aa9e89;line-height:1.55}.search{width:100%;padding:12px 14px;margin:18px 0 4px;background:#15110d;border:1px solid #b9924544;border-radius:10px;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px;margin-top:20px}.study-card{border:1px solid #b9924544;background:#15110d;border-radius:15px;padding:16px}.head{display:flex;justify-content:space-between;gap:8px}.word{font-size:27px;color:#f0d789}.meaning{font:12px system-ui;color:#9f927f;text-align:right}.meta{font:12px system-ui;color:#c9b88e;margin:8px 0}.example{font-style:italic;line-height:1.45}.actions{display:flex;gap:7px;margin-top:12px}.actions button,.quiz button{border:1px solid #b9924555;background:#211a12;color:#fff;border-radius:8px;padding:8px 10px;font-weight:700}.quiz{display:none;margin-top:12px}.quiz.open{display:block}.quiz input{width:100%;padding:10px;background:#0e0c0a;color:#fff;border:1px solid #b9924555;border-radius:8px}.feedback{font:13px system-ui;margin-top:7px}.feedback.ok{color:#75d28a}.feedback.bad{color:#ffb4ab}</style></head><body><header class="top"><a href="/fr/french-verbs">← VERBS</a><strong>🇫🇷 FRENCH STUDY</strong><a href="/fr/french-grammar">GRAMMAR →</a></header><main class="wrap"><div class="eyebrow">CORE LANGUAGE GUIDE</div><h1 class="title">FRENCH NOUNS</h1><p class="sub">Everyday nouns from the Universal Core Stories. Learn the article with the noun, hear it, then use it in your own French sentence.</p><input id="search" class="search" placeholder="Search French or English…"><div class="grid" id="grid"></div></main><script>const data=[['la clé','key','f','les clés','J’ai la clé.'],['la maison','house','f','les maisons','Je rentre à la maison.'],['l’appartement','apartment','m','les appartements','Mon appartement est petit.'],['la porte','door','f','les portes','J’ouvre la porte.'],['la fenêtre','window','f','les fenêtres','Je regarde par la fenêtre.'],['la table','table','f','les tables','Le téléphone est sur la table.'],['la chaise','chair','f','les chaises','Je m’assois sur la chaise.'],['le sac','bag','m','les sacs','La clé est dans mon sac.'],['le téléphone','phone','m','les téléphones','Mon téléphone est presque déchargé.'],['l’argent','money','m','—','J’ai de l’argent.'],['l’eau','water','f','—','Je bois de l’eau.'],['le pain','bread','m','les pains','J’achète du pain.'],['le café','coffee / café','m','les cafés','Je bois un café.'],['la rue','street','f','les rues','Je marche dans la rue.'],['la ville','city','f','les villes','La ville se réveille.'],['le magasin','shop','m','les magasins','Je vais au magasin.'],['le bus','bus','m','les bus','Je prends le bus.'],['le train','train','m','les trains','Elle attend le train.'],['la gare','station','f','les gares','Nous sommes à la gare.'],['la voiture','car','f','les voitures','La voiture est dans la rue.'],['l’homme','man','m','les hommes','L’homme regarde la porte.'],['la femme','woman','f','les femmes','La femme parle avec Misha.'],['le garçon','boy','m','les garçons','Le garçon trouve une clé.'],['la fille','girl','f','les filles','La fille écoute de la musique.'],['l’ami','friend','m','les amis','Mon ami peut m’aider.'],['la main','hand','f','les mains','La clé est dans sa main.'],['la poche','pocket','f','les poches','Je regarde dans ma poche.'],['le manteau','coat','m','les manteaux','Mon manteau est mouillé.'],['la pluie','rain','f','—','La pluie devient plus forte.'],['le matin','morning','m','les matins','Le matin est froid.'],['la nuit','night','f','les nuits','Je rentre la nuit.'],['le temps','time / weather','m','—','Je n’ai pas beaucoup de temps.']];const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,"'");const g=document.getElementById('grid');function render(filter=''){g.innerHTML='';data.filter(x=>norm(x[0]+' '+x[1]).includes(norm(filter))).forEach(([w,m,gender,pl,ex])=>{const base=w.replace(/^(le |la |l[’'])/,'');const c=document.createElement('article');c.className='study-card';c.dataset.word=base;c.innerHTML=`<div class="head"><div class="word" data-headword>${w}</div><div class="meaning">${m}</div></div><div class="meta">${gender==='m'?'MASCULINE':'FEMININE'} · PLURAL: ${pl}</div><div class="example">${ex}</div><div class="actions"><button class="listen">🔊 LISTEN</button><button class="practice">✎ PRACTICE</button></div><div class="quiz"><input placeholder="Type the French noun"><button class="check">CHECK</button><div class="feedback"></div></div>`;g.appendChild(c);c.querySelector('.listen').onclick=()=>speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(w),{lang:'fr-FR'}));c.querySelector('.practice').onclick=()=>c.querySelector('.quiz').classList.toggle('open');c.querySelector('.check').onclick=()=>{const f=c.querySelector('.feedback'),v=norm(c.querySelector('input').value).replace(/^(le |la |l')/,'').trim(),ok=v===norm(base);f.className='feedback '+(ok?'ok':'bad');f.textContent=ok?'✓ Correct':`Try again · ${w}`}})}render();document.getElementById('search').oninput=e=>render(e.target.value);</script><script src="/french-guide-practice.js?v=fr-1"></script></body></html>
