<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>French Verbs Guide | Hellboy Chronicles</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0907;color:#eadfc7;font-family:Georgia,serif}.top{position:sticky;top:0;z-index:4;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:#0b0907ee;border-bottom:1px solid #b9924555}.top a{color:#e5c469;text-decoration:none}.wrap{max-width:980px;margin:auto;padding:34px 18px 80px}.eyebrow{font:800 11px system-ui;letter-spacing:.15em;color:#d2ad54}.title{font-size:clamp(36px,7vw,64px);margin:7px 0}.sub{color:#aa9e89;line-height:1.55}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:26px}.study-card{border:1px solid #b9924544;background:#15110d;border-radius:15px;padding:16px}.head{display:flex;justify-content:space-between;gap:8px}.word{font-size:28px;color:#f0d789}.meaning{font:12px system-ui;color:#9f927f;text-align:right}.forms{font:14px system-ui;line-height:1.6;margin:12px 0;color:#d6c9b1}.example{font-style:italic;line-height:1.45}.actions{display:flex;gap:7px;margin-top:12px}.actions button,.quiz button{border:1px solid #b9924555;background:#211a12;color:#fff;border-radius:8px;padding:8px 10px;font-weight:700}.quiz{display:none;margin-top:12px}.quiz.open{display:block}.quiz input{width:100%;padding:10px;background:#0e0c0a;color:#fff;border:1px solid #b9924555;border-radius:8px}.feedback{font:13px system-ui;margin-top:7px}.feedback.ok{color:#75d28a}.feedback.bad{color:#ffb4ab}</style></head><body><header class="top"><a href="/fr/universal-core-stories">← THE LOST KEY</a><strong>🇫🇷 FRENCH STUDY</strong><a href="/fr/french-nouns">NOUNS →</a></header><main class="wrap"><div class="eyebrow">CORE LANGUAGE GUIDE</div><h1 class="title">FRENCH VERBS</h1><p class="sub">High-frequency verbs used in Universal Core Stories. Practice the infinitive, hear it, then write your own sentence. Capitalization and accents are optional in practice.</p><div class="grid" id="grid"></div></main><script>const data=[['être','to be',['je suis','tu es','il/elle est','nous sommes','vous êtes','ils/elles sont'],'Je suis à la maison.'],['avoir','to have',['j’ai','tu as','il/elle a','nous avons','vous avez','ils/elles ont'],'J’ai une clé.'],['aller','to go',['je vais','tu vas','il/elle va','nous allons','vous allez','ils/elles vont'],'Je vais au café.'],['venir','to come',['je viens','tu viens','il/elle vient','nous venons','vous venez','ils/elles viennent'],'Elle vient ce soir.'],['voir','to see',['je vois','tu vois','il/elle voit','nous voyons','vous voyez','ils/elles voient'],'Je vois le bus.'],['regarder','to look/watch',['je regarde','tu regardes','il regarde','nous regardons','vous regardez','ils regardent'],'Je regarde la rue.'],['parler','to speak',['je parle','tu parles','il parle','nous parlons','vous parlez','ils parlent'],'Nous parlons français.'],['dire','to say',['je dis','tu dis','il dit','nous disons','vous dites','ils disent'],'Je dis merci.'],['demander','to ask',['je demande','tu demandes','il demande','nous demandons','vous demandez','ils demandent'],'Je demande de l’aide.'],['savoir','to know',['je sais','tu sais','il sait','nous savons','vous savez','ils savent'],'Je sais où il est.'],['penser','to think',['je pense','tu penses','il pense','nous pensons','vous pensez','ils pensent'],'Je pense à la clé.'],['vouloir','to want',['je veux','tu veux','il veut','nous voulons','vous voulez','ils veulent'],'Je veux rentrer.'],['pouvoir','can / to be able',['je peux','tu peux','il peut','nous pouvons','vous pouvez','ils peuvent'],'Je peux vous aider.'],['devoir','must / to have to',['je dois','tu dois','il doit','nous devons','vous devez','ils doivent'],'Je dois partir.'],['donner','to give',['je donne','tu donnes','il donne','nous donnons','vous donnez','ils donnent'],'Je donne la clé à Anna.'],['prendre','to take',['je prends','tu prends','il prend','nous prenons','vous prenez','ils prennent'],'Je prends le bus.'],['trouver','to find',['je trouve','tu trouves','il trouve','nous trouvons','vous trouvez','ils trouvent'],'Je trouve ma clé.'],['perdre','to lose',['je perds','tu perds','il perd','nous perdons','vous perdez','ils perdent'],'Je perds souvent mes clés.'],['ouvrir','to open',['j’ouvre','tu ouvres','il ouvre','nous ouvrons','vous ouvrez','ils ouvrent'],'J’ouvre la porte.'],['fermer','to close',['je ferme','tu fermes','il ferme','nous fermons','vous fermez','ils ferment'],'Je ferme mon sac.'],['marcher','to walk',['je marche','tu marches','il marche','nous marchons','vous marchez','ils marchent'],'Je marche dans la rue.'],['attendre','to wait',['j’attends','tu attends','il attend','nous attendons','vous attendez','ils attendent'],'J’attends le bus.'],['aider','to help',['j’aide','tu aides','il aide','nous aidons','vous aidez','ils aident'],'Je peux aider mon ami.'],['se souvenir','to remember',['je me souviens','tu te souviens','il se souvient','nous nous souvenons','vous vous souvenez','ils se souviennent'],'Je me souviens du café.']];const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,"'").trim();const g=document.getElementById('grid');data.forEach(([w,m,fs,ex])=>{const c=document.createElement('article');c.className='study-card';c.dataset.word=w;c.innerHTML=`<div class="head"><div class="word" data-headword>${w}</div><div class="meaning">${m}</div></div><div class="forms">${fs.join('<br>')}</div><div class="example">${ex}</div><div class="actions"><button class="listen">🔊 LISTEN</button><button class="practice">✎ PRACTICE</button></div><div class="quiz"><input placeholder="Type the French infinitive"><button class="check">CHECK</button><div class="feedback"></div></div>`;g.appendChild(c);c.querySelector('.listen').onclick=()=>speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(w),{lang:'fr-FR'}));c.querySelector('.practice').onclick=()=>c.querySelector('.quiz').classList.toggle('open');c.querySelector('.check').onclick=()=>{const f=c.querySelector('.feedback'),v=c.querySelector('input').value;const ok=norm(v)===norm(w);f.className='feedback '+(ok?'ok':'bad');f.textContent=ok?'✓ Correct':`Try again · ${w}`}});</script><script src="/french-guide-practice.js?v=fr-1"></script></body></html>
