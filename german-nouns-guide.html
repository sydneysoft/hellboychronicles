<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>German Nouns Guide | Hellboy Chronicles</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0907;color:#eadfc7;font-family:Georgia,serif}.top{position:sticky;top:0;z-index:4;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:#0b0907ee;border-bottom:1px solid #b9924555}.top a{color:#e5c469;text-decoration:none}.wrap{max-width:980px;margin:auto;padding:34px 18px 80px}.eyebrow{font:800 11px system-ui;letter-spacing:.15em;color:#d2ad54}.title{font-size:clamp(36px,7vw,64px);margin:7px 0}.sub{color:#aa9e89;line-height:1.55}.search{width:100%;max-width:420px;margin-top:18px;padding:10px 12px;background:#12100d;color:#fff;border:1px solid #b9924555;border-radius:9px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:22px}.study-card{border:1px solid #b9924544;background:#15110d;border-radius:15px;padding:16px}.word{font-size:27px;color:#f0d789}.meaning,.meta{font:12px system-ui;color:#9f927f}.example{font-style:italic;line-height:1.45;margin:10px 0}.actions{display:flex;gap:7px}.actions button,.quiz button{border:1px solid #b9924555;background:#211a12;color:#fff;border-radius:8px;padding:8px 10px;font-weight:700}.quiz{display:none;margin-top:12px}.quiz.open{display:block}.quiz input{width:100%;padding:10px;background:#0e0c0a;color:#fff;border:1px solid #b9924555;border-radius:8px}.feedback{font:13px system-ui;margin-top:7px}.feedback.ok{color:#75d28a}.feedback.bad{color:#ffb4ab}</style></head><body><header class="top"><a href="/de/german-verbs">← VERBS</a><strong>🇩🇪 GERMAN STUDY</strong><a href="/de/german-grammar">GRAMMAR →</a></header><main class="wrap"><div class="eyebrow">CORE LANGUAGE GUIDE</div><h1 class="title">GERMAN NOUNS</h1><p class="sub">Useful nouns from the Universal Core Stories. German nouns are capitalized, but capitalization is optional in practice.</p><input class="search" id="search" placeholder="Search German or English"><div class="grid" id="grid"></div></main><script>const data=[['der Mann','man','die Männer','Der Mann wartet auf den Bus.'],['die Frau','woman','die Frauen','Die Frau sitzt am Fenster.'],['der Junge','boy','die Jungen','Der Junge sieht einen Schlüssel.'],['das Mädchen','girl','die Mädchen','Das Mädchen trinkt Wasser.'],['der Freund','friend','die Freunde','Mein Freund hilft mir.'],['die Familie','family','die Familien','Meine Familie lebt in der Stadt.'],['das Haus','house','die Häuser','Das Haus ist alt.'],['die Wohnung','apartment','die Wohnungen','Meine Wohnung ist klein.'],['das Zimmer','room','die Zimmer','Das Zimmer ist warm.'],['die Tür','door','die Türen','Ich öffne die Tür.'],['das Fenster','window','die Fenster','Ich sitze am Fenster.'],['der Tisch','table','die Tische','Das Handy liegt auf dem Tisch.'],['der Stuhl','chair','die Stühle','Die Tasche liegt auf dem Stuhl.'],['der Schlüssel','key','die Schlüssel','Ich suche meinen Schlüssel.'],['die Tasche','bag','die Taschen','Der Schlüssel ist in der Tasche.'],['das Handy','phone','die Handys','Mein Handy ist fast leer.'],['das Geld','money','—','Ich habe etwas Geld.'],['das Essen','food','—','Das Essen ist heiß.'],['das Wasser','water','—','Ich trinke Wasser.'],['das Brot','bread','—','Das Brot ist warm.'],['die Straße','street','die Straßen','Die Straße ist ruhig.'],['die Stadt','city','die Städte','Die Stadt wacht auf.'],['der Laden','shop','die Läden','Ich gehe zurück zum Laden.'],['das Café','café','die Cafés','Das Café ist noch offen.'],['der Bus','bus','die Busse','Ich nehme den Bus.'],['der Zug','train','die Züge','Die Frau wartet auf den Zug.'],['der Bahnhof','station','die Bahnhöfe','Wir sind am Bahnhof.'],['der Tag','day','die Tage','Es war ein langer Tag.'],['die Nacht','night','die Nächte','In der Nacht ist es ruhig.'],['der Morgen','morning','die Morgen','Der Morgen ist kalt.'],['die Zeit','time','die Zeiten','Ich habe keine Zeit.'],['der Ort','place','die Orte','Das ist ein ruhiger Ort.']];const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss').replace(/^(der|die|das)\s+/,'').trim();const g=document.getElementById('grid');function render(q=''){g.innerHTML='';data.filter(x=>!q||norm(x[0]).includes(norm(q))||norm(x[1]).includes(norm(q))).forEach(([w,m,p,ex])=>{const c=document.createElement('article');c.className='study-card';c.dataset.word=w.replace(/^(der|die|das)\s+/,'');c.innerHTML=`<div class="word" data-headword>${w}</div><div class="meaning">${m}</div><div class="meta">Plural: ${p}</div><div class="example">${ex}</div><div class="actions"><button class="listen">🔊 LISTEN</button><button class="practice">✎ PRACTICE</button></div><div class="quiz"><input placeholder="Type the German noun"><button class="check">CHECK</button><div class="feedback"></div></div>`;g.appendChild(c);const answer=w.replace(/^(der|die|das)\s+/,'');c.querySelector('.listen').onclick=()=>speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(w),{lang:'de-DE'}));c.querySelector('.practice').onclick=()=>c.querySelector('.quiz').classList.toggle('open');c.querySelector('.check').onclick=()=>{const f=c.querySelector('.feedback'),ok=norm(c.querySelector('input').value)===norm(answer);f.className='feedback '+(ok?'ok':'bad');f.textContent=ok?'✓ Correct':`Try again · ${answer}`}})}render();search.oninput=e=>render(e.target.value);</script><script src="/german-guide-practice.js?v=de-1"></script></body></html>
