<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>German Grammar Guide | Hellboy Chronicles</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0907;color:#eadfc7;font-family:Georgia,serif}.top{position:sticky;top:0;z-index:4;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:#0b0907ee;border-bottom:1px solid #b9924555}.top a{color:#e5c469;text-decoration:none}.wrap{max-width:980px;margin:auto;padding:34px 18px 80px}.eyebrow{font:800 11px system-ui;letter-spacing:.15em;color:#d2ad54}.title{font-size:clamp(36px,7vw,64px);margin:7px 0}.sub{color:#aa9e89;line-height:1.55}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button{padding:9px 12px;border-radius:9px;border:1px solid #b9924555;background:#211a12;color:#fff;font-weight:800}.tabs button.on{background:#7f1d27}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.study-card{border:1px solid #b9924544;background:#15110d;border-radius:15px;padding:16px}.word{font-size:25px;color:#f0d789}.meaning{font:12px system-ui;color:#9f927f}.example{font-style:italic;line-height:1.45;margin:10px 0}.actions{display:flex;gap:7px}.actions button,.quiz button{border:1px solid #b9924555;background:#211a12;color:#fff;border-radius:8px;padding:8px 10px;font-weight:700}.quiz{display:none;margin-top:12px}.quiz.open{display:block}.quiz input{width:100%;padding:10px;background:#0e0c0a;color:#fff;border:1px solid #b9924555;border-radius:8px}.feedback{font:13px system-ui;margin-top:7px}.feedback.ok{color:#75d28a}.feedback.bad{color:#ffb4ab}</style></head><body><header class="top"><a href="/de/german-nouns">← NOUNS</a><strong>🇩🇪 GERMAN STUDY</strong><a href="/de/universal-stories/lost-key">STORY →</a></header><main class="wrap"><div class="eyebrow">CORE LANGUAGE GUIDE</div><h1 class="title">GERMAN GRAMMAR</h1><p class="sub">Practice pronouns, articles and common adjective patterns used in the Universal Core Stories.</p><div class="tabs"><button data-tab="pronouns" class="on">PRONOUNS</button><button data-tab="articles">ARTICLES</button><button data-tab="adjectives">ADJECTIVES</button></div><div class="grid" id="grid"></div></main><script>const sets={pronouns:[['ich','I','Ich bin müde.'],['du','you','Du hast den Schlüssel.'],['er','he','Er wartet auf den Bus.'],['sie','she','Sie kommt heute.'],['es','it','Es ist kalt.'],['wir','we','Wir gehen nach Hause.'],['ihr','you plural','Ihr seid hier.'],['sie','they','Sie sind müde.'],['Sie','you formal','Sie haben recht.']],articles:[['der','the · masculine','der Mann'],['die','the · feminine','die Frau'],['das','the · neuter','das Haus'],['die','the · plural','die Schlüssel'],['ein','a/an · masculine/neuter','ein Mann'],['eine','a/an · feminine','eine Frau'],['einen','a · masculine accusative','einen Schlüssel'],['kein','no/not a','kein Problem']],adjectives:[['gut','good','Das ist ein guter Plan.'],['schlecht','bad','Das ist eine schlechte Idee.'],['groß','big','eine große Stadt'],['klein','small','ein kleines Café'],['alt','old','ein alter Mann'],['neu','new','eine neue Tasche'],['jung','young','ein junger Mann'],['kalt','cold','ein kalter Morgen'],['warm','warm','ein warmes Zimmer'],['müde','tired','Ich bin müde.'],['nass','wet','Meine Jacke ist nass.'],['hungrig','hungry','Ich bin hungrig.'],['glücklich','happy','Sie ist glücklich.'],['traurig','sad','Er ist traurig.']]};const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss').trim();let tab='pronouns';const g=document.getElementById('grid');function render(){g.innerHTML='';sets[tab].forEach(([w,m,ex])=>{const c=document.createElement('article');c.className='study-card';c.dataset.word=w;c.innerHTML=`<div class="word" data-headword>${w}</div><div class="meaning">${m}</div><div class="example">${ex}</div><div class="actions"><button class="listen">🔊 LISTEN</button><button class="practice">✎ PRACTICE</button></div><div class="quiz"><input placeholder="Type the German form"><button class="check">CHECK</button><div class="feedback"></div></div>`;g.appendChild(c);c.querySelector('.listen').onclick=()=>speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(w),{lang:'de-DE'}));c.querySelector('.practice').onclick=()=>c.querySelector('.quiz').classList.toggle('open');c.querySelector('.check').onclick=()=>{const f=c.querySelector('.feedback'),ok=norm(c.querySelector('input').value)===norm(w);f.className='feedback '+(ok?'ok':'bad');f.textContent=ok?'✓ Correct':`Try again · ${w}`}})}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));render()});render();</script><script src="/german-guide-practice.js?v=de-1"></script></body></html>
