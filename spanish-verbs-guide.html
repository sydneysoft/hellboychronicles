<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spanish Verbs Guide | Hellboy Chronicles</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0907;color:#eadfc7;font-family:Georgia,serif}.top{position:sticky;top:0;z-index:4;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:#0b0907ee;border-bottom:1px solid #b9924555}.top a{color:#e5c469;text-decoration:none}.wrap{max-width:980px;margin:auto;padding:34px 18px 80px}.eyebrow{font:800 11px system-ui;letter-spacing:.15em;color:#d2ad54}.title{font-size:clamp(36px,7vw,64px);margin:7px 0}.sub{color:#aa9e89;line-height:1.55}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:26px}.study-card{border:1px solid #b9924544;background:#15110d;border-radius:15px;padding:16px}.head{display:flex;justify-content:space-between;gap:8px}.word{font-size:28px;color:#f0d789}.meaning{font:12px system-ui;color:#9f927f;text-align:right}.forms{font:14px system-ui;line-height:1.6;margin:12px 0;color:#d6c9b1}.example{font-style:italic;line-height:1.45}.actions{display:flex;gap:7px;margin-top:12px}.actions button,.quiz button{border:1px solid #b9924555;background:#211a12;color:#fff;border-radius:8px;padding:8px 10px;font-weight:700}.quiz{display:none;margin-top:12px}.quiz.open{display:block}.quiz input{width:100%;padding:10px;background:#0e0c0a;color:#fff;border:1px solid #b9924555;border-radius:8px}.feedback{font:13px system-ui;margin-top:7px}.feedback.ok{color:#75d28a}.feedback.bad{color:#ffb4ab}</style></head><body><header class="top"><a href="/es/universal-core-stories">← THE LOST KEY</a><strong>🇪🇸 SPANISH STUDY</strong><a href="/es/spanish-nouns">NOUNS →</a></header><main class="wrap"><div class="eyebrow">CORE LANGUAGE GUIDE</div><h1 class="title">SPANISH VERBS</h1><p class="sub">High-frequency verbs used in Universal Core Stories. Practice the infinitive, hear it, then write your own sentence. Capitalization and accents are optional in practice.</p><div class="grid" id="grid"></div></main><script>const data=[['ser','to be',['yo soy','tú eres','él/ella es','nosotros somos','vosotros sois','ellos son'],'Soy estudiante.'],['estar','to be / state',['yo estoy','tú estás','él/ella está','nosotros estamos','vosotros estáis','ellos están'],'Estoy en casa.'],['haber','to have / auxiliary',['yo he','tú has','él/ella ha','nosotros hemos','vosotros habéis','ellos han'],'He encontrado la llave.'],['ir','to go',['yo voy','tú vas','él/ella va','nosotros vamos','vosotros vais','ellos van'],'Voy al café.'],['venir','to come',['yo vengo','tú vienes','él viene','nosotros venimos','vosotros venís','ellos vienen'],'Ella viene esta noche.'],['ver','to see',['yo veo','tú ves','él ve','nosotros vemos','vosotros veis','ellos ven'],'Veo el autobús.'],['hablar','to speak',['yo hablo','tú hablas','él habla','nosotros hablamos','vosotros habláis','ellos hablan'],'Hablamos español.'],['decir','to say',['yo digo','tú dices','él dice','nosotros decimos','vosotros decís','ellos dicen'],'Digo gracias.'],['preguntar','to ask',['yo pregunto','tú preguntas','él pregunta','nosotros preguntamos','vosotros preguntáis','ellos preguntan'],'Pregunto por la llave.'],['saber','to know',['yo sé','tú sabes','él sabe','nosotros sabemos','vosotros sabéis','ellos saben'],'Sé dónde está.'],['pensar','to think',['yo pienso','tú piensas','él piensa','nosotros pensamos','vosotros pensáis','ellos piensan'],'Pienso en la llave.'],['querer','to want',['yo quiero','tú quieres','él quiere','nosotros queremos','vosotros queréis','ellos quieren'],'Quiero volver a casa.'],['poder','can / to be able',['yo puedo','tú puedes','él puede','nosotros podemos','vosotros podéis','ellos pueden'],'Puedo ayudarte.'],['deber','must / should',['yo debo','tú debes','él debe','nosotros debemos','vosotros debéis','ellos deben'],'Debo salir.'],['dar','to give',['yo doy','tú das','él da','nosotros damos','vosotros dais','ellos dan'],'Doy la llave a Anna.'],['tomar','to take',['yo tomo','tú tomas','él toma','nosotros tomamos','vosotros tomáis','ellos toman'],'Tomo el autobús.'],['encontrar','to find',['yo encuentro','tú encuentras','él encuentra','nosotros encontramos','vosotros encontráis','ellos encuentran'],'Encuentro mi llave.'],['perder','to lose',['yo pierdo','tú pierdes','él pierde','nosotros perdemos','vosotros perdéis','ellos pierden'],'Pierdo mis llaves.'],['abrir','to open',['yo abro','tú abres','él abre','nosotros abrimos','vosotros abrís','ellos abren'],'Abro la puerta.'],['cerrar','to close',['yo cierro','tú cierras','él cierra','nosotros cerramos','vosotros cerráis','ellos cierran'],'Cierro mi bolsa.'],['caminar','to walk',['yo camino','tú caminas','él camina','nosotros caminamos','vosotros camináis','ellos caminan'],'Camino por la calle.'],['esperar','to wait',['yo espero','tú esperas','él espera','nosotros esperamos','vosotros esperáis','ellos esperan'],'Espero el autobús.'],['ayudar','to help',['yo ayudo','tú ayudas','él ayuda','nosotros ayudamos','vosotros ayudáis','ellos ayudan'],'Ayudo a mi amigo.']];const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();const g=document.getElementById('grid');data.forEach(([w,m,fs,ex])=>{const c=document.createElement('article');c.className='study-card';c.dataset.word=w;c.innerHTML=`<div class="head"><div class="word" data-headword>${w}</div><div class="meaning">${m}</div></div><div class="forms">${fs.join('<br>')}</div><div class="example">${ex}</div><div class="actions"><button class="listen">🔊 LISTEN</button><button class="practice">✎ PRACTICE</button></div><div class="quiz"><input placeholder="Type the Spanish infinitive"><button class="check">CHECK</button><div class="feedback"></div></div>`;g.appendChild(c);c.querySelector('.listen').onclick=()=>speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(w),{lang:'es-ES'}));c.querySelector('.practice').onclick=()=>c.querySelector('.quiz').classList.toggle('open');c.querySelector('.check').onclick=()=>{const f=c.querySelector('.feedback'),v=c.querySelector('input').value;const ok=norm(v)===norm(w);f.className='feedback '+(ok?'ok':'bad');f.textContent=ok?'✓ Correct':`Try again · ${w}`}});</script><script src="/spanish-guide-practice.js?v=es-1"></script></body></html>
