<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#120e0c"><title>Polish Folk Tales — Text Edition | Hellboy Chronicles</title><meta name="description" content="Read eight expanded Polish folk legends in English or Polish."><style>*{box-sizing:border-box}html,body{margin:0;background:#120e0c;color:#2b2119;font-family:Georgia,serif}.top{position:sticky;top:0;z-index:9;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#17110eee;border-bottom:1px solid #b9954b;color:#f4e6c8}.top a{color:#e4bf68;text-decoration:none;font:bold 14px system-ui}.lang{display:flex;gap:6px}.lang a{padding:8px 11px;border-radius:10px;background:#29201b}.lang .active{background:#8c1d28}.hero{text-align:center;color:#f2e4c7;padding:40px 18px 26px}.hero small{color:#d5b45d;letter-spacing:.18em;font:bold 11px system-ui}.hero h1{font-size:clamp(2.2rem,7vw,4.3rem);margin:10px 0;color:#c72938}.hero p{color:#bdb09f;max-width:680px;margin:auto;line-height:1.6}.index{max-width:900px;margin:auto;padding:0 16px 50px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{padding:20px;border:1px solid #a98a4b77;border-radius:16px;background:#1c1714;color:#f4e7cc;text-decoration:none}.card b{display:block;font-size:1.15rem}.card span{display:block;color:#a89b89;margin-top:5px;font-style:italic}.reader{display:none;max-width:760px;margin:auto;padding:25px 16px 100px}.reader.open{display:block}.hidden{display:none}.paper{background:#f0e3c5;padding:clamp(24px,6vw,58px);border-radius:5px;box-shadow:0 25px 70px #0009;line-height:1.85;font-size:1.08rem}.paper h2{text-align:center;font-size:2rem;margin:0}.paper .alt{text-align:center;color:#8d332d;font-style:italic;margin:5px 0 28px}.paper p{margin:0 0 1.25em}.paper p:first-of-type:first-letter{float:left;font-size:4rem;line-height:.75;padding:8px 8px 0 0;color:#9c1d28}.nav{position:sticky;bottom:10px;display:grid;grid-template-columns:55px 1fr 55px;gap:8px;max-width:480px;margin:18px auto;padding:8px;background:#17110eee;border:1px solid #b9954b77;border-radius:18px}.nav button{height:46px;border:1px solid #c6a75c77;border-radius:12px;background:#29201b;color:#f5e6c7;font-weight:900}.nav button:nth-child(2){background:#8c1d28}.tools{text-align:center;margin:0 0 14px;color:#9b8870;font:12px system-ui}.paper ::selection{background:#e3c75f88}@media(max-width:620px){.index{grid-template-columns:1fr}.paper{padding:28px 22px}}</style></head><body><header class="top"><a id="back" href="/">‹ LIBRARY</a><div class="lang"><a id="en" href="/polish-folk-tales/collection">🇬🇧 EN</a><a id="pl" href="/pl/polish-folk-tales/collection">🇵🇱 PL</a></div></header><main><div id="home"><section class="hero"><small>POLISH FOLK TALES · TEXT EDITION</small><h1 id="heading">POLISH FOLK TALES</h1><p id="intro">Eight expanded legends from Kraków, Warsaw and the Tatra Mountains. Choose a story and enter old Poland through its dragons, magicians, guardians and mysteries.</p></section><section class="index" id="index"></section></div><section class="reader" id="reader"><div class="tools" id="tools">SELECT TEXT TO USE YOUR BROWSER'S LOOK UP / TRANSLATE TOOLS</div><article class="paper"><h2 id="title"></h2><div class="alt" id="alt"></div><div id="story"></div></article><nav class="nav"><button id="prev">←</button><button id="idx">INDEX</button><button id="next">→</button></nav></section></main><script>const isPL=/^\/pl(?:\/|$)/.test(location.pathname);const data=[{en:'The Wawel Dragon',pl:'Smok Wawelski',place:'Kraków',E:[`Long ago, when Kraków was still young, a terrible dragon made its lair beneath Wawel Hill. From its cavern beside the Vistula came smoke, thunderous growls, and the sound of claws against stone. Shepherds feared for their flocks, merchants hurried through the city gates before sunset, and even brave soldiers lowered their voices when they spoke of the beast.`,`King Krak promised a rich reward to anyone who could free the city. Knights arrived with polished armor and heavy spears. One after another they entered the cavern, trusting strength to defeat strength. One after another they fled scorched and humiliated.`,`Then a young shoemaker named Skuba asked for a chance. The court laughed at his leather apron and empty hands. Skuba did not argue. He filled a sheepskin with sulfur and pitch, stitched it carefully, and left it where the hungry dragon would find it. The beast swallowed the false sheep whole. Soon an unbearable fire burned inside its belly.`,`The dragon rushed to the Vistula and drank. It drank until the river seemed to fall. Yet the more it drank, the greater its thirst became, until at last the monster could drink no more and its reign of terror ended. Kraków erupted in celebration.`,`Skuba had possessed neither a sword nor noble blood. What he had was patience, observation, and the courage to think differently. From that day, people remembered that a sharp mind may accomplish what brute strength cannot.`],P:[`Dawno temu, gdy Kraków był jeszcze młodym grodem, pod Wawelem zamieszkał straszliwy smok. Z jego jamy nad Wisłą wydobywał się dym, potężne ryki i odgłos pazurów uderzających o skałę. Pasterze bali się o stada, kupcy wracali przed zmrokiem, a nawet odważni wojowie ściszali głos, gdy mówili o bestii.`,`Król Krak obiecał wielką nagrodę temu, kto uwolni miasto. Przybywali rycerze w lśniących zbrojach, uzbrojeni w miecze i włócznie. Każdy wierzył, że siła pokona siłę. Każdy jednak wracał pokonany przez ogień smoka.`,`Wtedy młody szewczyk Skuba poprosił o szansę. Dworzanie śmiali się z jego skórzanego fartucha i pustych rąk. Skuba nie dyskutował. Wypełnił owczą skórę siarką i smołą, dokładnie ją zaszył i pozostawił przed jamą. Głodny smok połknął przynętę.`,`Wkrótce w jego brzuchu zapłonął nieznośny ogień. Smok rzucił się do Wisły i pił bez końca. Im więcej jednak pił, tym większe czuł pragnienie, aż wreszcie jego panowanie nad Krakowem dobiegło końca.`,`Skuba nie miał miecza ani szlacheckiego pochodzenia. Miał za to cierpliwość, pomysłowość i odwagę, by myśleć inaczej. Krakowianie zapamiętali, że rozum potrafi zwyciężyć tam, gdzie sama siła zawodzi.`]},{en:'The Warsaw Mermaid',pl:'Syrenka Warszawska',place:'Warszawa',E:[`Before Warsaw became a great capital, a mermaid swam up the Vistula and rested on its sandy bank. She loved the river, the reeds, and the voices of fishermen returning at dusk. Sometimes she sang, and her song was so beautiful that the fishermen stopped rowing simply to listen.`,`A greedy merchant heard stories about the mysterious singer. Thinking only of profit, he trapped the mermaid and locked her away. Her cries reached a young fisherman, who gathered his courage and freed her before the merchant could carry her from the river.`,`The mermaid thanked the people who had shown her kindness. She raised a sword and shield and promised that if Warsaw ever faced danger, she would stand beside its inhabitants.`,`Generations passed and the settlement became a city, but the promise endured. The mermaid became Warsaw's guardian: fierce when defending freedom, gentle toward those who protected one another.`],P:[`Zanim Warszawa stała się wielką stolicą, syrena przypłynęła Wisłą i odpoczęła na piaszczystym brzegu. Pokochała rzekę, szum trzcin i głosy rybaków wracających o zmierzchu. Czasem śpiewała tak pięknie, że rybacy przestawali wiosłować, aby jej słuchać.`,`Chciwy kupiec usłyszał o tajemniczej śpiewaczce. Myśląc jedynie o zysku, schwytał syrenę i uwięził ją. Jej płacz usłyszał młody rybak. Zebrał odwagę i uwolnił ją, zanim kupiec zdołał wywieźć ją znad rzeki.`,`Syrena podziękowała ludziom za okazane dobro. Uniosła miecz i tarczę i obiecała, że jeśli Warszawie kiedykolwiek zagrozi niebezpieczeństwo, stanie w jej obronie.`,`Mijały pokolenia, osada stała się miastem, lecz obietnica pozostała. Syrenka została strażniczką Warszawy — waleczną wobec zagrożenia i wierną tym, którzy pomagają sobie nawzajem.`]},{en:'The Basilisk of Warsaw',pl:'Bazyliszek Warszawski',place:'Warszawa',E:[`In the cellars of old Warsaw, people whispered of a creature whose glance could turn a living person to stone. It was called the Basilisk. Children were warned never to wander into ruined houses near the old market, yet curiosity has always been stronger than warnings.`,`When several townspeople vanished, fear spread through the streets. Swords were useless if a warrior could not look at the enemy. At last a clever plan emerged: confront the monster not with a blade, but with a mirror.`,`Deep underground, the Basilisk opened its terrible eyes. Instead of meeting a human gaze, it saw its own reflection. The power it had used against others returned upon itself. Silence filled the cellar.`,`Warsaw learned that some dangers cannot be defeated by attacking them directly. Sometimes the surest defense is to make evil face itself.`],P:[`W piwnicach dawnej Warszawy szeptano o stworzeniu, którego spojrzenie potrafiło zamienić człowieka w kamień. Nazywano je Bazyliszkiem. Dzieciom zakazywano zbliżać się do ruin w pobliżu starego rynku, lecz ciekawość bywa silniejsza od ostrzeżeń.`,`Gdy zaczęli znikać mieszkańcy, strach ogarnął ulice. Miecz był bezużyteczny, jeśli wojownik nie mógł spojrzeć na przeciwnika. W końcu powstał sprytny plan: stanąć przed potworem nie z ostrzem, lecz z lustrem.`,`Głęboko pod ziemią Bazyliszek otworzył straszliwe oczy. Zamiast ludzkiego spojrzenia zobaczył własne odbicie. Moc, którą kierował przeciw innym, zwróciła się przeciw niemu. W piwnicy zapadła cisza.`,`Warszawa przekonała się, że nie każde niebezpieczeństwo pokonuje się bezpośrednim atakiem. Czasem najlepszą obroną jest sprawić, by zło zobaczyło samo siebie.`]},{en:'Pan Twardowski',pl:'Pan Twardowski',place:'Kraków',E:[`Pan Twardowski was a scholar who desired knowledge beyond ordinary human limits. He studied secret books, watched the stars, and dreamed of commanding forces hidden from other men. At last, legend says, he made a bargain with the devil.`,`Twardowski carefully wrote one condition into the agreement: the devil could claim him only in Rome. Certain that he would simply never visit that city, the magician enjoyed years of extraordinary power. He performed wonders and even summoned the spirit of a dead queen for a grieving king.`,`But clever agreements often contain traps on both sides. One evening Twardowski entered an inn whose name was Rome. The devil appeared to collect his debt. As Twardowski was carried away, he prayed, and the power dragging him toward darkness weakened.`,`According to the legend, he never returned to Earth and never reached hell. He remained suspended on the Moon, looking down upon Poland. His story warns that intelligence without humility may become its own kind of prison.`],P:[`Pan Twardowski był uczonym, który pragnął wiedzy przekraczającej zwyczajne ludzkie możliwości. Studiował tajemne księgi, obserwował gwiazdy i marzył o panowaniu nad siłami ukrytymi przed innymi. Legenda mówi, że zawarł pakt z diabłem.`,`Twardowski wpisał do umowy warunek: diabeł mógł zabrać jego duszę tylko w Rzymie. Mag był pewien, że wystarczy nigdy tam nie pojechać. Przez lata korzystał więc z niezwykłej mocy, dokonywał cudów, a nawet przywołał ducha zmarłej królowej dla pogrążonego w żałobie króla.`,`Sprytne umowy kryją jednak pułapki dla obu stron. Pewnego wieczoru Twardowski wszedł do karczmy, która nosiła nazwę Rzym. Pojawił się diabeł, by odebrać należność. Gdy Twardowskiego unoszono ku ciemności, zaczął się modlić i diabelska moc osłabła.`,`Według legendy nie wrócił na Ziemię, ale też nie dotarł do piekła. Pozostał na Księżycu, spoglądając na Polskę. Jego historia przypomina, że rozum pozbawiony pokory może stać się własnym więzieniem.`]},{en:'The Golden Duck',pl:'Złota Kaczka',place:'Warszawa',E:[`Beneath Warsaw, so the story goes, lay a hidden palace where a golden duck guarded enormous treasure. A poor young soldier heard that anyone brave enough to find her might become rich. With little to lose, he descended into the underground chambers.`,`The golden duck offered him a purse of coins. There was one condition: before midnight he had to spend every coin entirely on himself. He could buy clothes, food, horses, or anything he desired, but he could share nothing.`,`The soldier spent freely until he met an old veteran begging in the street. Looking at the man's worn face, he forgot the promise and gave him a coin. At once the magic vanished. The riches were lost.`,`Yet the soldier discovered something more valuable. Wealth that forbids generosity owns its possessor. He returned to ordinary life poorer in gold, but richer in understanding.`],P:[`Pod Warszawą, jak głosi legenda, znajdował się ukryty pałac, w którym Złota Kaczka strzegła ogromnego skarbu. Biedny młody żołnierz usłyszał, że śmiałek, który ją odnajdzie, może stać się bogaty. Zszedł więc do podziemi.`,`Złota Kaczka wręczyła mu sakiewkę monet. Postawiła jeden warunek: przed północą musiał wydać wszystko wyłącznie na siebie. Mógł kupić ubrania, jedzenie, konie i wszystko, czego zapragnął, lecz nie wolno mu było podzielić się z nikim.`,`Żołnierz wydawał pieniądze, aż spotkał starego weterana proszącego o pomoc. Widząc jego zmęczoną twarz, zapomniał o warunku i podał mu monetę. W tej samej chwili czar prysł, a obiecane bogactwo zniknęło.`,`Żołnierz zrozumiał jednak coś cenniejszego. Majątek, który zabrania człowiekowi dzielić się z innymi, sam staje się jego panem. Wrócił do zwykłego życia uboższy w złoto, lecz bogatszy w mądrość.`]},{en:'The Trumpeter of Kraków',pl:'Hejnał Mariacki',place:'Kraków',E:[`When danger approached medieval Kraków, a watchman high in the tower of St. Mary's Church saw enemy riders racing toward the city. There was no time to descend the long staircase. He lifted his trumpet and sounded the alarm across the rooftops.`,`The melody woke guards and citizens. Gates were closed and defenses prepared. But while the trumpeter continued to play, an arrow flew toward the tower and struck him. The warning ended in the middle of a phrase.`,`Kraków was saved because one man remained at his post long enough to warn everyone else. Centuries later, the hejnał is still played from St. Mary's tower and traditionally breaks off suddenly, remembering the unfinished call.`,`A melody can last only a moment, yet courage can echo for centuries.`],P:[`Gdy do średniowiecznego Krakowa zbliżało się niebezpieczeństwo, strażnik wysoko na wieży kościoła Mariackiego zobaczył wrogich jeźdźców pędzących ku miastu. Nie było czasu na zejście po schodach. Podniósł trąbkę i zagrał alarm nad dachami Krakowa.`,`Melodia obudziła straże i mieszkańców. Zamknięto bramy i przygotowano obronę. Trębacz grał dalej, gdy w stronę wieży pomknęła strzała. Sygnał urwał się nagle w połowie melodii.`,`Kraków ocalał, ponieważ jeden człowiek pozostał na swoim stanowisku wystarczająco długo, by ostrzec innych. Po wielu stuleciach hejnał wciąż rozbrzmiewa z wieży Mariackiej i tradycyjnie urywa się nagle, przypominając niedokończone ostrzeżenie.`,`Melodia może trwać tylko chwilę, lecz odwaga potrafi rozbrzmiewać przez stulecia.`]},{en:'The Sleeping Knights of the Tatras',pl:'Śpiący Rycerze Tatr',place:'Tatry',E:[`Deep beneath the Tatra Mountains, legend says, an army of Polish knights sleeps in a vast cavern. Their horses stand nearby, their armor is ready, and a mysterious fire burns without consuming its fuel.`,`From time to time a shepherd or wanderer discovers the hidden entrance. Inside, one knight awakens just enough to ask a single question: “Is it time?” The visitor answers that Poland is not yet in its hour of greatest need, and the knight lowers his head and sleeps again.`,`The sleeping army is not a promise that someone else will solve every danger. It is a symbol of courage waiting inside a people — strength that awakens when responsibility can no longer be avoided.`,`Above the cavern the mountains remain silent, resembling a giant knight lying beneath the sky, keeping watch even in sleep.`],P:[`Głęboko pod Tatrami, jak mówi legenda, śpi armia polskich rycerzy. W ogromnej jaskini stoją ich konie, zbroje są gotowe, a tajemniczy ogień płonie, nie zużywając opału.`,`Od czasu do czasu pasterz lub wędrowiec odnajduje ukryte wejście. Wewnątrz jeden z rycerzy budzi się na chwilę i zadaje tylko jedno pytanie: „Czy już czas?” Przybysz odpowiada, że Polska nie znalazła się jeszcze w godzinie największej potrzeby. Rycerz opuszcza głowę i ponownie zasypia.`,`Śpiące wojsko nie jest obietnicą, że ktoś inny rozwiąże każde niebezpieczeństwo. Jest symbolem odwagi ukrytej w ludziach — siły, która budzi się, gdy nie można już uciekać od odpowiedzialności.`,`Nad jaskinią góry pozostają ciche. Ich kształt przypomina olbrzymiego rycerza leżącego pod niebem i czuwającego nawet podczas snu.`]},{en:"The Two Towers of St. Mary's Church",pl:'Dwie Wieże Kościoła Mariackiego',place:'Kraków',E:[`The two towers of St. Mary's Church rise above Kraków's market square, but they are strikingly unequal. A legend explains the difference through two brothers, both skilled builders, who were entrusted with raising the towers.`,`At first they worked side by side. Soon rivalry entered their hearts. The older brother watched the younger brother's tower rise more quickly and feared that his own achievement would be forgotten. Admiration turned to envy, and envy to violence.`,`After his brother's death, the surviving builder completed the taller tower, but victory brought him no peace. Looking down at the city, he understood that no monument could erase what jealousy had destroyed.`,`The uneven towers remained. To generations of Kraków's citizens they became a warning carved into the skyline: ambition can build extraordinary things, but envy can ruin the person who builds them.`],P:[`Dwie wieże kościoła Mariackiego górują nad krakowskim Rynkiem, lecz wyraźnie różnią się wysokością. Legenda tłumaczy tę różnicę historią dwóch braci, znakomitych budowniczych, którym powierzono wzniesienie wież.`,`Początkowo pracowali obok siebie. Z czasem w ich sercach pojawiła się rywalizacja. Starszy brat patrzył, jak wieża młodszego rośnie szybciej, i zaczął się obawiać, że jego własne dzieło zostanie zapomniane. Podziw zmienił się w zazdrość, a zazdrość w przemoc.`,`Po śmierci brata ocalały budowniczy ukończył wyższą wieżę, lecz zwycięstwo nie przyniosło mu spokoju. Spoglądając na miasto, zrozumiał, że żaden monument nie wymaże tego, co zniszczyła zazdrość.`,`Nierówne wieże pozostały. Dla kolejnych pokoleń krakowian stały się ostrzeżeniem zapisanym w panoramie miasta: ambicja potrafi tworzyć wielkie rzeczy, ale zazdrość może zniszczyć ich twórcę.`]}];const home=document.getElementById('home'),reader=document.getElementById('reader'),index=document.getElementById('index'),title=document.getElementById('title'),alt=document.getElementById('alt'),story=document.getElementById('story');document.documentElement.lang=isPL?'pl':'en';document.getElementById(isPL?'pl':'en').classList.add('active');back.href=isPL?'/pl':'/';back.textContent=isPL?'‹ BIBLIOTEKA':'‹ LIBRARY';if(isPL){heading.textContent='POLSKIE BAŚNIE I LEGENDY';intro.textContent='Osiem rozbudowanych legend z Krakowa, Warszawy i Tatr. Wybierz opowieść i wejdź do świata dawnej Polski.';tools.textContent='ZAZNACZ TEKST, ABY UŻYĆ FUNKCJI TŁUMACZENIA / LOOK UP W PRZEGLĄDARCE'}index.innerHTML=data.map((x,i)=>`<a class="card" href="?story=${i+1}" data-i="${i}"><b>${isPL?x.pl:x.en}</b><span>${isPL?x.en:x.pl} · ${x.place}</span></a>`).join('');let current=0;function openStory(i){current=Math.max(0,Math.min(7,i));const x=data[current];title.textContent=isPL?x.pl:x.en;alt.textContent=(isPL?x.en:x.pl)+' · '+x.place;story.innerHTML=(isPL?x.P:x.E).map(p=>`<p>${p}</p>`).join('');home.classList.add('hidden');reader.classList.add('open');prev.disabled=current===0;next.disabled=current===7;idx.textContent=isPL?'INDEKS':'INDEX';history.replaceState(null,'',`${location.pathname}?story=${current+1}`);scrollTo(0,0)}function showIndex(){reader.classList.remove('open');home.classList.remove('hidden');history.replaceState(null,'',location.pathname);scrollTo(0,0)}index.onclick=e=>{const a=e.target.closest('.card');if(!a)return;e.preventDefault();openStory(+a.dataset.i)};prev.onclick=()=>openStory(current-1);next.onclick=()=>openStory(current+1);idx.onclick=showIndex;const q=+new URLSearchParams(location.search).get('story');if(q>=1&&q<=8)openStory(q-1);</script><script src="/folk-reader-features.js?v=perf-6" defer></script></body></html>
