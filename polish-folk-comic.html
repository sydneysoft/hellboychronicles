let page=0;function src(p){const s=stories[Math.floor(p/6)];return `${base}${s[3]}/page-${String(p%6+1).padStart(2,'0')}.webp`}function render(){page=Math.max(0,Math.min(47,page));const si=Math.floor(page/6),s=stories[si],local=page%6;pageImage.src=src(page);pageImage.alt=`${pl?s[1]:s[0]} — ${pl?'strona':'page'} ${local+1}`;readerTitle.textContent=pl?s[1]:s[0];readerPlace.textContent=s[2];storyNumber.textContent=`${pl?'OPOWIEŚĆ':'STORY'} ${si+1} / 8`;counter.textContent=`${pl?'STRONA':'PAGE'} ${page+1} / 48`;indexBtn.textContent=pl?'INDEKS':'INDEX';prev.disabled=page===0;next.disabled=page===47;indexView.classList.add('hidden');reader.classList.add('open');history.replaceState(null,'',`${location.pathname}?page=${page+1}#reader`);if(page<47){const im=new Image;im.src=src(page+1)}scrollTo(0,0)}function showIndex(){reader.classList.remove('open');indexView.classList.remove('hidden');history.replaceState(null,'',location.pathname);scrollTo(0,0)}chapters.onclick=e=>{const a=e.target.closest('.chapter');if(!a)return;e.preventDefault();page=+a.dataset.page;render()};prev.onclick=()=>{if(page){page--;render()}};next.onclick=()=>{if(page<47){page++;render()}};indexBtn.onclick=showIndex;addEventListener('keydown',e=>{if(!reader.classList.contains('open'))return;if(e.key==='ArrowLeft'&&page){page--;render()}else if(e.key==='ArrowRight'&&page<47){page++;render()}else if(e.key==='Escape')showIndex()});const q=+new URLSearchParams(location.search).get('page');if(q>=1&&q<=48){page=q-1;render()}</script></body></html>
