<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>French Grammar Guide | Hellboy Chronicles</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0907;color:#eadfc7;font-family:Georgia,serif}.top{position:sticky;top:0;z-index:4;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:#0b0907ee;border-bottom:1px solid #b9924555}.top a{color:#e5c469;text-decoration:none}.wrap{max-width:980px;margin:auto;padding:34px 18px 80px}.eyebrow{font:800 11px system-ui;letter-spacing:.15em;color:#d2ad54}.title{font-size:clamp(36px,7vw,64px);margin:7px 0}.sub{color:#aa9e89;line-height:1.55}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button{border:1px solid #b9924555;background:#17120d;color:#fff;border-radius:9px;padding:9px 12px;font-weight:800}.tabs button.on{background:#7f1d27}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.study-card{border:1px solid #b9924544;background:#15110d;border-radius:15px;padding:16px}.word{font-size:27px;color:#f0d789}.meaning{font:12px system-ui;color:#9f927f;margin-top:3px}.meta{font:12px system-ui;color:#c9b88e;margin:9px 0}.example{font-style:italic;line-height:1.45}.actions{display:flex;gap:7px;margin-top:12px}.actions button,.quiz button{border:1px solid #b9924555;background:#211a12;color:#fff;border-radius:8px;padding:8px 10px;font-weight:700}.quiz{display:none;margin-top:12px}.quiz.open{display:block}.quiz input{width:100%;padding:10px;background:#0e0c0a;color:#fff;border:1px solid #b9924555;border-radius:8px}.feedback{font:13px system-ui;margin-top:7px}.feedback.ok{color:#75d28a}.feedback.bad{color:#ffb4ab}.note{padding:14px;border:1px solid #b9924544;background:#17120d;border-radius:12px;color:#cdbc99;line-height:1.55;margin-bottom:18px}</style></head><body><header class="top"><a href="/fr/french-nouns">← NOUNS</a><strong>🇫🇷 FRENCH STUDY</strong><a href="/fr/universal-core-stories">THE LOST KEY →</a></header><main class="wrap"><div class="eyebrow">CORE LANGUAGE GUIDE</div><h1 class="title">FRENCH GRAMMAR</h1><p class="sub">Pronouns, articles and adjective agreement for the sentences used in Universal Core Stories.</p><div class="tabs"><button class="on" data-tab="pronouns">PRONOUNS</button><button data-tab="articles">ARTICLES</button><button data-tab="adjectives">ADJECTIVES</button></div><div id="note" class="note"></div><div class="grid" id="grid"></div></main><script>const sections={pronouns:{note:'French subject pronouns usually appear before the verb. Je becomes j’ before a vowel sound: j’ai, j’ouvre.',items:[['je','I','1st person singular','Je suis ici.'],['tu','you (informal)','2nd person singular','Tu as la clé.'],['il','he / it','masculine singular','Il est au café.'],['elle','she / it','feminine singular','Elle est à la maison.'],['on','one / we (informal)','common spoken subject','On va au magasin.'],['nous','we','1st person plural','Nous sommes prêts.'],['vous','you / you all','formal or plural','Vous êtes ici.'],['ils','they','masculine/mixed plural','Ils prennent le bus.'],['elles','they','feminine plural','Elles sont prêtes.']]},articles:{note:'French nouns normally need an article. Learn the article together with the noun: la clé, le sac, l’eau. Before a vowel, le/la often becomes l’.',items:[['le','the','masculine singular','le sac'],['la','the','feminine singular','la clé'],['l’','the','before a vowel','l’appartement'],['les','the','plural','les clés'],['un','a / one','masculine','un bus'],['une','a / one','feminine','une maison'],['du','some / of the','masculine mass noun','du pain'],['de la','some / of the','feminine mass noun','de la nourriture'],['de l’','some / of the','before vowel','de l’eau']]},adjectives:{note:'French adjectives agree with the noun in gender and number. A common pattern is masculine → +e for feminine and +s for plural, but several frequent adjectives are irregular.',items:[['petit / petite','small','m / f','un petit sac · une petite maison'],['grand / grande','big / tall','m / f','un grand bus · une grande ville'],['vieux / vieille','old','m / f','un vieux magasin · une vieille maison'],['jeune','young','same m/f','un jeune garçon · une jeune fille'],['bon / bonne','good','m / f','un bon choix · une bonne idée'],['mauvais / mauvaise','bad','m / f','un mauvais bus · une mauvaise idée'],['froid / froide','cold','m / f','un matin froid · une nuit froide'],['chaud / chaude','hot / warm','m / f','un café chaud · une soupe chaude'],['fatigué / fatiguée','tired','m / f','il est fatigué · elle est fatiguée'],['mouillé / mouillée','wet','m / f','un manteau mouillé · une veste mouillée'],['heureux / heureuse','happy','m / f','il est heureux · elle est heureuse'],['triste','sad','same m/f','il est triste · elle est triste'],['beau / belle','beautiful','irregular m/f','un beau jour · une belle ville'],['nouveau / nouvelle','new','irregular m/f','un nouveau sac · une nouvelle clé']]}};let tab='pronouns';const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,"'").trim();function render(){const sec=sections[tab];document.getElementById('note').textContent=sec.note;const g=document.getElementById('grid');g.innerHTML='';sec.items.forEach(([w,m,meta,ex])=>{const target=w.split('/')[0].trim();const c=document.createElement('article');c.className='study-card';c.dataset.word=target;c.innerHTML=`<div class="word" data-headword>${w}</div><div class="meaning">${m}</div><div class="meta">${meta}</div><div class="example">${ex}</div><div class="actions"><button class="listen">🔊 LISTEN</button><button class="practice">✎ PRACTICE</button></div><div class="quiz"><input placeholder="Type the French form"><button class="check">CHECK</button><div class="feedback"></div></div>`;g.appendChild(c);c.querySelector('.listen').onclick=()=>speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(target),{lang:'fr-FR'}));c.querySelector('.practice').onclick=()=>c.querySelector('.quiz').classList.toggle('open');c.querySelector('.check').onclick=()=>{const f=c.querySelector('.feedback'),v=c.querySelector('input').value;const accepted=w.split('/').map(x=>norm(x.trim()));const ok=accepted.includes(norm(v));f.className='feedback '+(ok?'ok':'bad');f.textContent=ok?'✓ Correct':`Try again · ${w}`}})}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));render()});render();</script><script src="/french-guide-practice.js?v=fr-1"></script></body></html>
